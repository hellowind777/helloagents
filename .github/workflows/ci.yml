name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['20.19.0', '22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: 运行测试
        run: npm test
      - name: 校验清单版本一致
        run: node cli.mjs sync-version --check

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 安装类型检查工具（仅工作流内，包保持零依赖）
        run: npm install --no-save typescript@^6 @types/node@^22
      - name: JSDoc 类型检查
        run: npx tsc -p jsconfig.json
