<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 240" role="img" aria-labelledby="banner-title">
  <defs>
    <linearGradient id="hero-grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#172554"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <linearGradient id="text-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e0e7ff"/>
      <stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <radialGradient id="glow-1" cx="0.15" cy="0.35" r="0.45">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow-2" cx="0.85" cy="0.6" r="0.4">
      <stop offset="0%" stop-color="#c084fc" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M 50 0 L 0 0 0 50" fill="none" stroke="rgba(255,255,255,0.025)" stroke-width="0.5"/>
    </pattern>
  </defs>

  <rect width="800" height="240" fill="url(#hero-grad)"/>
  <rect width="800" height="240" fill="url(#grid)"/>
  <rect width="800" height="240" fill="url(#glow-1)"/>
  <rect width="800" height="240" fill="url(#glow-2)"/>

  <!-- Decorative rings -->
  <circle cx="95" cy="95" r="75" fill="none" stroke="rgba(56,189,248,0.06)" stroke-width="1.5"/>
  <circle cx="95" cy="95" r="58" fill="none" stroke="rgba(129,140,248,0.1)" stroke-width="1.5"/>
  <circle cx="95" cy="95" r="42" fill="rgba(56,189,248,0.08)"/>

  <!-- Logo mark: abstract "HA" monogram -->
  <text x="95" y="103" fill="url(#accent-grad)" font-size="44" font-family="system-ui,-apple-system,sans-serif" font-weight="800" text-anchor="middle" letter-spacing="-1">HA</text>

  <!-- Main title -->
  <text x="192" y="88" fill="#f1f5f9" font-size="46" font-family="system-ui,-apple-system,sans-serif" font-weight="700" letter-spacing="-0.5">Hello<tspan fill="url(#accent-grad)">AGENTS</tspan></text>

  <!-- Subtitle -->
  <text x="192" y="128" fill="#94a3b8" font-size="17" font-family="system-ui,-apple-system,sans-serif" font-weight="400">AI 编码 CLI 的思维激活层 — 纠偏内核 + 按需思维技能，一条命令分发</text>

  <!-- Feature tags -->
  <rect x="192" y="150" width="126" height="28" rx="14" fill="rgba(56,189,248,0.12)"/>
  <text x="255" y="169" fill="#7dd3fc" font-size="12" font-family="system-ui,-apple-system,sans-serif" font-weight="500" text-anchor="middle">23 个思维技能</text>

  <rect x="326" y="150" width="108" height="28" rx="14" fill="rgba(129,140,248,0.12)"/>
  <text x="380" y="169" fill="#a5b4fc" font-size="12" font-family="system-ui,-apple-system,sans-serif" font-weight="500" text-anchor="middle">5 个宿主 CLI</text>

  <rect x="442" y="150" width="118" height="28" rx="14" fill="rgba(192,132,252,0.12)"/>
  <text x="501" y="169" fill="#d8b4fe" font-size="12" font-family="system-ui,-apple-system,sans-serif" font-weight="500" text-anchor="middle">零依赖 · 零构建</text>

  <!-- Bottom decorative line -->
  <rect x="0" y="237" width="800" height="3" fill="url(#accent-grad)" opacity="0.5"/>
</svg>
